<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
    (function(){
      var file=(location.pathname.split('/').pop()||'index.html').toLowerCase();
      var map={'index.html':'/api/public/homepage-data.php','':'/api/public/homepage-data.php','about.html':'/api/content/about.php','clubs.html':'/api/content/clubs.php','curriculum.html':'/api/content/curriculum.php','facilities.html':'/api/content/facilities-settings.php','teachers.html':'/api/content/teachers-settings.php','testimonials.html':'/api/content/testimonials-settings.php','gallery.html':'/api/content/gallery-settings.php','activities.html':'/api/content/activities-settings.php','events.html':'/api/content/activities-settings.php','news.html':'/api/content/news-settings.php','announcements.html':'/api/content/announcements-settings.php','admission.html':'/api/content/admission.php','school-background.html':'/api/content/school-background.php','sponsorship.html':'/api/content/sponsorship.php','give-back.html':'/api/content/giveback.php','parents.html':'/api/content/parents.php','people-behind-school.html':'/api/content/people-behind-school.php','resources.html':'/api/content/resources.php'};
      var api=map[file];
      if(!api)return;
      window.__pagePath=api.split('/').pop();
      window.__pageData=fetch(api).then(function(r){return r.ok?r.json():null;}).then(function(data){
        var urls=[], seen={};
        function add(url){if(!url||seen[url]||String(url).indexOf('data:')===0)return;if(String(url).indexOf('http')!==0&&String(url).indexOf('/')!==0)return;seen[url]=1;urls.push(url);}
        function walk(value,key){if(!value)return;if(typeof value==='string'){if(/image|slide|logo|photo|background|file_path|file_url/i.test(key||''))add(value);return;}if(Array.isArray(value)){value.forEach(function(item){walk(item,key);});return;}if(typeof value==='object'){Object.keys(value).forEach(function(name){walk(value[name],name);});}}
        walk(data&&data.data?data.data:data,'');
        urls.slice(0,8).forEach(function(url,index){var link=document.createElement('link');link.rel='preload';link.as='image';link.href=url;if(index===0)link.setAttribute('fetchpriority','high');document.head.appendChild(link);});
        return data;
      }).catch(function(){return null;});
    })();
    </script>
    <title>Meet Our Staff - Excellence Academy</title>
    <link rel="stylesheet" href="css/style.css?v=20261022a">
</head>
<body>
    <div id="header-placeholder"></div>
    
    <main>
        <section class="page-hero-section">
            <div class="page-hero-background"></div>
            <div class="page-hero-overlay">
                <div class="container">
                    <h1 class="page-hero-title">Meet Our Staff</h1>
                    <p class="page-hero-subtitle">Our Expert Teachers</p>
                </div>
            </div>
        </section>

        <section class="teachers-section section-padding bg-white">
            <div class="container">
                <div class="section-header text-center">
                    <h2 class="section-title">Our Expert Teachers</h2>
                    <p class="section-subtitle">Meet our dedicated faculty members who bring passion, expertise, and innovation to every classroom</p>
                </div>
                <div id="teachers-container">
                    <div class="text-center" style="padding: 60px 20px;">
                        <p style="font-size: 18px; color: var(--text-light);">Teacher information will be displayed here once added to the system.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    
    <div id="footer-placeholder"></div>
    
    <script src="js/static-pages.js?v=20261022b"></script>
    <script src="js/page-data-loader.js?v=20261021"></script>
    <script>
        (async function() {
            const data = await PageDataLoader.loadTeachersData();
            const container = document.getElementById('teachers-container');
            
            // Update hero
            if (data.teachersSettings) {
                const hero = document.querySelector('.page-hero-section');
                if (data.teachersSettings.title) {
                    const title = hero.querySelector('.page-hero-title');
                    if (title) title.textContent = data.teachersSettings.title;
                }
                if (data.teachersSettings.subtitle) {
                    const subtitle = hero.querySelector('.page-hero-subtitle');
                    if (subtitle) subtitle.textContent = data.teachersSettings.subtitle;
                }
                if (data.teachersSettings.hero_image) {
                    const bg = hero.querySelector('.page-hero-background');
                    if (bg) {
                        const heroImageUrl = data.teachersSettings.hero_image.replace(/'/g, "\\'");
                        PageDataLoader.paintHero(heroImageUrl);
                    }
                }
            }
            
            // Render teachers
            if (data.teachers && data.teachers.length > 0) {
                let teachersHtml = '<div class="teachers-grid">';
                data.teachers.forEach(teacher => {
                    teachersHtml += `
                        <div class="teacher-card">
                            <div class="teacher-image-wrapper">
                                ${teacher.image ? `
                                    <img src="${escapeHtml(teacher.image)}" alt="${escapeHtml(teacher.name)}" class="teacher-image" 
                                         onload="this.parentElement.querySelector('.teacher-loading').style.display='none';" 
                                         onerror="this.parentElement.querySelector('.teacher-loading').style.display='flex';">
                                ` : ''}
                                <div class="teacher-loading" style="${teacher.image ? 'display: none;' : 'display: flex;'}">
                                    <div class="loading-spinner"></div>
                                </div>
                            </div>
                            <div class="teacher-name-bar">
                                <h3 class="teacher-name">${escapeHtml((teacher.name || '').toUpperCase())}</h3>
                                ${teacher.position ? `<p class="teacher-position">${escapeHtml((teacher.position || '').toUpperCase())}</p>` : ''}
                            </div>
                            <div class="teacher-details">
                                <div class="teacher-detail-item">
                                    <svg class="detail-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2">
                                        <circle cx="12" cy="12" r="10"></circle>
                                        <polyline points="12 6 12 12 16 14"></polyline>
                                    </svg>
                                    <span>Years of Experience: ${escapeHtml(teacher.years_experience || '5')}</span>
                                </div>
                                <div class="teacher-detail-item">
                                    <svg class="detail-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2">
                                        <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                                        <path d="M6 12v5c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2v-5"></path>
                                    </svg>
                                    <span>Subject: ${escapeHtml(teacher.department || 'SST')}</span>
                                </div>
                                ${teacher.email ? `
                                    <div class="teacher-detail-item">
                                        <svg class="detail-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2">
                                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                            <polyline points="22,6 12,13 2,6"></polyline>
                                        </svg>
                                        <span>Email: ${escapeHtml(teacher.email)}</span>
                                    </div>
                                ` : ''}
                                ${teacher.phone ? `
                                    <div class="teacher-detail-item">
                                        <svg class="detail-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9333ea" stroke-width="2">
                                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                                        </svg>
                                        <span>Contact: ${escapeHtml(teacher.phone)}</span>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                });
                teachersHtml += '</div>';
                container.innerHTML = teachersHtml;
            }
        })();
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
<script src="js/main.js?v=20261022b"></script>
</body>
</html>
