<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events - Excellence Academy</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="header-placeholder"></div>
    
    <main>
        <section class="page-hero-section">
            <div class="page-hero-background"></div>
            <div class="page-hero-overlay">
                <div class="container">
                    <h1 class="page-hero-title">Events</h1>
                    <p class="page-hero-subtitle">Upcoming Events</p>
                </div>
            </div>
        </section>

        <section class="section-padding bg-white">
            <div class="container">
                <div class="section-header text-center">
                    <h2 class="section-title">Upcoming Events</h2>
                    <p class="section-subtitle">Stay informed about our school events and important dates.</p>
                </div>

                <div id="events-container" class="events-cards-grid">
                    <!-- Default events -->
                    <div class="event-card event-card-blue">
                        <div class="event-image-container">
                            <div class="event-calendar-icon">
                                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2">
                                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                    <line x1="16" y1="2" x2="16" y2="6"></line>
                                    <line x1="8" y1="2" x2="8" y2="6"></line>
                                    <line x1="3" y1="10" x2="21" y2="10"></line>
                                </svg>
                            </div>
                        </div>
                        <div class="event-content">
                            <div class="event-date">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2">
                                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                    <line x1="16" y1="2" x2="16" y2="6"></line>
                                    <line x1="8" y1="2" x2="8" y2="6"></line>
                                    <line x1="3" y1="10" x2="21" y2="10"></line>
                                </svg>
                                <span>April 20, 2024</span>
                            </div>
                            <h3 class="event-title">Annual Sports Day</h3>
                            <p class="event-description">Join us for our annual sports day featuring various competitions and events.</p>
                            <div class="event-time">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <polyline points="12 6 12 12 16 14"></polyline>
                                </svg>
                                <span>9:00 AM - 3:00 PM</span>
                            </div>
                            <div class="event-location">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2">
                                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                    <circle cx="12" cy="10" r="3"></circle>
                                </svg>
                                <span>School Sports Ground</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    
    <div id="footer-placeholder"></div>
    
    <script src="js/static-pages.js"></script>
    <script src="js/page-data-loader.js"></script>
    <script src="js/main.js"></script>
    <script>
        (async function() {
            const data = await PageDataLoader.loadEventsData();
            const container = document.getElementById('events-container');
            
            // Update hero
            if (data.activitiesSettings) {
                const hero = document.querySelector('.page-hero-section');
                if (data.activitiesSettings.title) {
                    const title = hero.querySelector('.page-hero-title');
                    if (title) title.textContent = data.activitiesSettings.title;
                }
                if (data.activitiesSettings.subtitle) {
                    const subtitle = hero.querySelector('.page-hero-subtitle');
                    if (subtitle) subtitle.textContent = data.activitiesSettings.subtitle;
                }
                if (data.activitiesSettings.hero_image) {
                    const bg = hero.querySelector('.page-hero-background');
                    if (bg) {
                        const heroImageUrl = data.activitiesSettings.hero_image.replace(/'/g, "\\'");
                        bg.style.backgroundImage = `url('${heroImageUrl}')`;
                    }
                }
            }
            
            // Render events
            if (data.activities && data.activities.length > 0) {
                const cardColors = ['blue', 'purple', 'pink'];
                let eventsHtml = '';
                data.activities.slice(0, 3).forEach((event, index) => {
                    const color = cardColors[index % 3];
                    const eventDate = event.date ? new Date(event.date).toLocaleDateString('en-US', {year: 'numeric', month: 'long', day: 'numeric'}) : 'April 20, 2024';
                    const eventImage = event.image || '';
                    eventsHtml += `
                        <div class="event-card event-card-${color}">
                            <div class="event-image-container">
                                ${eventImage ? `
                                    <img src="${escapeHtml(eventImage)}" 
                                         alt="${escapeHtml(event.title || 'Event')}"
                                         class="event-image"
                                         onerror="this.onerror=null; this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                    <div class="event-calendar-icon" style="display: none;">
                                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#${color === 'blue' ? '2563eb' : color === 'purple' ? '9333ea' : 'ec4899'}" stroke-width="2">
                                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                            <line x1="16" y1="2" x2="16" y2="6"></line>
                                            <line x1="8" y1="2" x2="8" y2="6"></line>
                                            <line x1="3" y1="10" x2="21" y2="10"></line>
                                        </svg>
                                    </div>
                                ` : `
                                    <div class="event-calendar-icon">
                                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#${color === 'blue' ? '2563eb' : color === 'purple' ? '9333ea' : 'ec4899'}" stroke-width="2">
                                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                            <line x1="16" y1="2" x2="16" y2="6"></line>
                                            <line x1="8" y1="2" x2="8" y2="6"></line>
                                            <line x1="3" y1="10" x2="21" y2="10"></line>
                                        </svg>
                                    </div>
                                `}
                            </div>
                            <div class="event-content">
                                <div class="event-date">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2">
                                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                        <line x1="16" y1="2" x2="16" y2="6"></line>
                                        <line x1="8" y1="2" x2="8" y2="6"></line>
                                        <line x1="3" y1="10" x2="21" y2="10"></line>
                                    </svg>
                                    <span>${escapeHtml(eventDate)}</span>
                                </div>
                                <h3 class="event-title">${escapeHtml(event.title || 'Activity Title')}</h3>
                                ${event.description ? `<p class="event-description">${escapeHtml(event.description)}</p>` : ''}
                                ${event.time ? `
                                    <div class="event-time">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2">
                                            <circle cx="12" cy="12" r="10"></circle>
                                            <polyline points="12 6 12 12 16 14"></polyline>
                                        </svg>
                                        <span>${escapeHtml(event.time)}</span>
                                    </div>
                                ` : ''}
                                ${event.location ? `
                                    <div class="event-location">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2">
                                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                            <circle cx="12" cy="10" r="3"></circle>
                                        </svg>
                                        <span>${escapeHtml(event.location)}</span>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = eventsHtml;
            }
        })();
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
