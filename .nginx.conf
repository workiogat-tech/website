# Nginx configuration for Render
# This file is optional - Render will use this if present

server {
    listen 8080;
    server_name _;
    root /opt/render/project/src;
    index index.php index.html;

    # Maximum upload size
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Handle PHP files
    location ~ \.php$ {
        fastcgi_pass unix:/tmp/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Serve static files directly
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|json|html)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Allow access to uploads directory
    location /uploads/ {
        alias /opt/render/project/src/uploads/;
        expires 1y;
        add_header Cache-Control "public";
    }

    # Allow access to CSS and JS directories
    location /css/ {
        alias /opt/render/project/src/css/;
        expires 1M;
        add_header Cache-Control "public";
    }

    location /js/ {
        alias /opt/render/project/src/js/;
        expires 1M;
        add_header Cache-Control "public";
    }

    # API routes
    location /api/ {
        try_files $uri $uri/ /api/index.php?$query_string;
    }

    # Main routing - send everything to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(sql|log|md|env|git)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
