<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
    (function(){
      var file=(location.pathname.split('/').pop()||'index.html').toLowerCase();
      var map={'index.html':'/api/public/homepage-data.php','':'/api/public/homepage-data.php','about.html':'/api/content/about.php','clubs.html':'/api/content/clubs.php','curriculum.html':'/api/content/curriculum.php','facilities.html':'/api/content/facilities-settings.php','teachers.html':'/api/content/teachers-settings.php','testimonials.html':'/api/content/testimonials-settings.php','gallery.html':'/api/content/gallery-settings.php','activities.html':'/api/content/activities-settings.php','events.html':'/api/content/activities-settings.php','news.html':'/api/content/news-settings.php','announcements.html':'/api/content/announcements-settings.php','admission.html':'/api/content/admission.php','school-background.html':'/api/content/school-background.php','sponsorship.html':'/api/content/sponsorship.php','give-back.html':'/api/content/giveback.php','parents.html':'/api/content/parents.php','people-behind-school.html':'/api/content/people-behind-school.php','resources.html':'/api/content/resources.php'};
      var api=map[file];
      if(!api)return;
      window.__pagePath=api.split('/').pop();
      window.__pageData=fetch(api).then(function(r){return r.ok?r.json():null;}).then(function(data){
        var urls=[], seen={};
        function add(url){if(!url||seen[url]||String(url).indexOf('data:')===0)return;if(String(url).indexOf('http')!==0&&String(url).indexOf('/')!==0)return;seen[url]=1;urls.push(url);}
        function walk(value,key){if(!value)return;if(typeof value==='string'){if(/image|slide|logo|photo|background|file_path|file_url/i.test(key||''))add(value);return;}if(Array.isArray(value)){value.forEach(function(item){walk(item,key);});return;}if(typeof value==='object'){Object.keys(value).forEach(function(name){walk(value[name],name);});}}
        walk(data&&data.data?data.data:data,'');
        urls.slice(0,8).forEach(function(url,index){var link=document.createElement('link');link.rel='preload';link.as='image';link.href=url;if(index===0)link.setAttribute('fetchpriority','high');document.head.appendChild(link);});
        return data;
      }).catch(function(){return null;});
    })();
    </script>
    <title>Activities - Excellence Academy</title>
    <link rel="stylesheet" href="css/style.css?v=20261022a">
</head>
<body>
    <div id="header-placeholder"></div>
    
    <main>
        <section class="page-hero-section">
            <div class="page-hero-background"></div>
            <div class="page-hero-overlay">
                <div class="container">
                    <h1 class="page-hero-title">School Activities</h1>
                    <p class="page-hero-subtitle">Discover the vibrant life at Excellence Academy</p>
                </div>
            </div>
        </section>

        <section class="activities-section section-padding bg-white">
            <div class="container">
                <div class="section-header text-center">
                    <h2 class="section-title">School Activities</h2>
                    <p class="section-subtitle">Discover the vibrant life at Excellence Academy through our diverse range of activities</p>
                </div>
                <div id="activities-container">
                    <div class="text-center" style="padding: 60px 20px;">
                        <p style="font-size: 18px; color: var(--text-light);">Activities will be displayed here once added to the system.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    
    <div id="footer-placeholder"></div>
    
    <script src="js/static-pages.js?v=20261022b"></script>
    <script src="js/page-data-loader.js?v=20261021"></script>
    <script>
        (async function() {
            const data = await PageDataLoader.loadEventsData(); // Activities use same data structure
            const container = document.getElementById('activities-container');
            
            // Update hero
            if (data.activitiesSettings) {
                const hero = document.querySelector('.page-hero-section');
                if (data.activitiesSettings.title) {
                    const title = hero.querySelector('.page-hero-title');
                    if (title) title.textContent = data.activitiesSettings.title;
                }
                if (data.activitiesSettings.subtitle) {
                    const subtitle = hero.querySelector('.page-hero-subtitle');
                    if (subtitle) subtitle.textContent = data.activitiesSettings.subtitle;
                }
                if (data.activitiesSettings.hero_image) {
                    const bg = hero.querySelector('.page-hero-background');
                    if (bg) {
                        const heroImageUrl = data.activitiesSettings.hero_image.replace(/'/g, "\\'");
                        PageDataLoader.paintHero(heroImageUrl);
                    }
                }
            }
            
            // Render activities
            if (data.activities && data.activities.length > 0) {
                let activitiesHtml = '<div class="activities-grid">';
                data.activities.forEach(activity => {
                    activitiesHtml += `
                        <div class="activity-card">
                            ${activity.image ? `
                                <div class="activity-image">
                                    <img src="${escapeHtml(activity.image)}" alt="${escapeHtml(activity.title)}">
                                </div>
                            ` : ''}
                            <div class="activity-content">
                                <h3 class="activity-title">${escapeHtml(activity.title || '')}</h3>
                                ${activity.date ? `
                                    <p class="activity-date">📅 ${escapeHtml(new Date(activity.date).toLocaleDateString('en-US', {year: 'numeric', month: 'long', day: 'numeric'}))}</p>
                                ` : ''}
                                ${activity.description ? `
                                    <p class="activity-description">${escapeHtml(activity.description)}</p>
                                ` : ''}
                            </div>
                        </div>
                    `;
                });
                activitiesHtml += '</div>';
                container.innerHTML = activitiesHtml;
            }
        })();
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
<script src="js/main.js?v=20261022b"></script>
</body>
</html>
