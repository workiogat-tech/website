<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
    (function(){
      var file=(location.pathname.split('/').pop()||'index.html').toLowerCase();
      var map={'index.html':'/api/public/homepage-data.php','':'/api/public/homepage-data.php','about.html':'/api/content/about.php','clubs.html':'/api/content/clubs.php','curriculum.html':'/api/content/curriculum.php','facilities.html':'/api/content/facilities-settings.php','teachers.html':'/api/content/teachers-settings.php','testimonials.html':'/api/content/testimonials-settings.php','gallery.html':'/api/content/gallery-settings.php','activities.html':'/api/content/activities-settings.php','events.html':'/api/content/activities-settings.php','news.html':'/api/content/news-settings.php','announcements.html':'/api/content/announcements-settings.php','admission.html':'/api/content/admission.php','school-background.html':'/api/content/school-background.php','sponsorship.html':'/api/content/sponsorship.php','give-back.html':'/api/content/giveback.php','parents.html':'/api/content/parents.php','people-behind-school.html':'/api/content/people-behind-school.php','resources.html':'/api/content/resources.php'};
      var api=map[file];
      if(!api)return;
      window.__pagePath=api.split('/').pop();
      window.__pageData=fetch(api).then(function(r){return r.ok?r.json():null;}).then(function(data){
        var urls=[], seen={};
        function add(url){if(!url||seen[url]||String(url).indexOf('data:')===0)return;if(String(url).indexOf('http')!==0&&String(url).indexOf('/')!==0)return;seen[url]=1;urls.push(url);}
        function walk(value,key){if(!value)return;if(typeof value==='string'){if(/image|slide|logo|photo|background|file_path|file_url/i.test(key||''))add(value);return;}if(Array.isArray(value)){value.forEach(function(item){walk(item,key);});return;}if(typeof value==='object'){Object.keys(value).forEach(function(name){walk(value[name],name);});}}
        walk(data&&data.data?data.data:data,'');
        urls.slice(0,8).forEach(function(url,index){var link=document.createElement('link');link.rel='preload';link.as='image';link.href=url;if(index===0)link.setAttribute('fetchpriority','high');document.head.appendChild(link);});
        return data;
      }).catch(function(){return null;});
    })();
    </script>
    <title>School Gallery - Excellence Academy</title>
    <link rel="stylesheet" href="css/style.css?v=20261022a">
</head>
<body>
    <div id="header-placeholder"></div>
    
    <main>
        <section class="page-hero-section">
            <div class="page-hero-background"></div>
            <div class="page-hero-overlay">
                <div class="container">
                    <h1 class="page-hero-title">School Gallery</h1>
                    <p class="page-hero-subtitle">Photos and Memories</p>
                </div>
            </div>
        </section>

        <section class="section-padding bg-white gallery-section">
            <div class="container">
                <div id="gallery-container">
                    <div class="gallery-empty-state">
                        <div class="gallery-empty-icon">
                            <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#d1d5db" stroke-width="1.5">
                                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                <polyline points="21 15 16 10 5 21"></polyline>
                            </svg>
                        </div>
                        <h3 class="gallery-empty-title">No Photos Available</h3>
                        <p class="gallery-empty-text">Photos will appear here once they are uploaded to the Gallery section in the admin panel.</p>
                    </div>
                </div>
            </div>
        </section>
        
        <!-- Image Modal / Lightbox -->
        <div id="imageModal" class="gallery-lightbox" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000; align-items: center; justify-content: center; padding: 20px; opacity: 0; transition: opacity 0.3s ease;">
            <button onclick="closeImageModal()" class="lightbox-close" style="position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.2); color: white; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; font-size: 24px; display: flex; align-items: center; justify-content: center; transition: background 0.3s; z-index: 10001;">✕</button>
            
            <button onclick="navigateImage(-1)" class="lightbox-nav lightbox-prev" style="position: absolute; left: 20px; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.2); color: white; border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; font-size: 24px; display: flex; align-items: center; justify-content: center; transition: background 0.3s; z-index: 10001;">‹</button>
            
            <button onclick="navigateImage(1)" class="lightbox-nav lightbox-next" style="position: absolute; right: 20px; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.2); color: white; border: none; width: 50px; height: 50px; border-radius: 50%; cursor: pointer; font-size: 24px; display: flex; align-items: center; justify-content: center; transition: background 0.3s; z-index: 10001;">›</button>
            
            <div class="lightbox-content" style="position: relative; max-width: 90%; max-height: 90%; display: flex; flex-direction: column; align-items: center;">
                <div class="lightbox-image-container" style="position: relative; max-width: 100%; max-height: 85vh; display: flex; align-items: center; justify-content: center;">
                    <img id="modalImage" src="" alt="" class="lightbox-image" style="max-width: 100%; max-height: 85vh; object-fit: contain; border-radius: 8px;">
                </div>
                <div class="lightbox-info" style="color: white; text-align: center; margin-top: 20px; opacity: 0; transition: opacity 0.3s ease;">
                    <p id="modalImageTitle" style="font-size: 18px; margin: 0 0 8px 0; font-weight: 500;"></p>
                    <p id="modalImageCounter" style="font-size: 14px; margin: 0; opacity: 0.7;"></p>
                </div>
            </div>
        </div>
    </main>
    
    <div id="footer-placeholder"></div>
    
    <script src="js/static-pages.js?v=20261022b"></script>
    <script src="js/page-data-loader.js?v=20261021"></script>
    <script>
        let galleryImages = [];
        let currentImageIndex = 0;
        
        (async function() {
            const data = await PageDataLoader.loadGalleryData();
            const container = document.getElementById('gallery-container');
            
            // Update hero
            if (data.gallerySettings) {
                const hero = document.querySelector('.page-hero-section');
                if (data.gallerySettings.title) {
                    const title = hero.querySelector('.page-hero-title');
                    if (title) title.textContent = data.gallerySettings.title;
                }
                if (data.gallerySettings.subtitle) {
                    const subtitle = hero.querySelector('.page-hero-subtitle');
                    if (subtitle) subtitle.textContent = data.gallerySettings.subtitle;
                }
                if (data.gallerySettings.hero_image) {
                    const bg = hero.querySelector('.page-hero-background');
                    if (bg) {
                        // Escape single quotes in the URL for CSS
                        const heroImageUrl = data.gallerySettings.hero_image.replace(/'/g, "\\'");
                        PageDataLoader.paintHero(heroImageUrl);
                    }
                }
            }
            
            // Render gallery
            if (data.galleryImages && data.galleryImages.length > 0) {
                galleryImages = data.galleryImages.map((img, index) => ({
                    url: img.file_path || img.file_url || img.filename || '',
                    title: img.original_name || 'Gallery Image',
                    index: index
                })).filter(img => img.url);
                
                if (galleryImages.length > 0) {
                    let galleryHtml = '<div class="gallery-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 40px;">';
                    galleryImages.forEach((image, index) => {
                        galleryHtml += `
                            <div class="gallery-item scroll-reveal" 
                                 data-index="${index}"
                                 style="position: relative; overflow: hidden; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.3s, box-shadow 0.3s; cursor: pointer; aspect-ratio: 1;" 
                                 onmouseover="this.style.transform='scale(1.05)'; this.style.boxShadow='0 8px 12px rgba(0,0,0,0.2)'"
                                 onmouseout="this.style.transform='scale(1)'; this.style.boxShadow='0 4px 6px rgba(0,0,0,0.1)'"
                                 onclick="openImageModal(${index})">
                                <img src="${image.url.replace(/'/g, "\\'")}" 
                                     alt="${escapeHtml(image.title)}"
                                     style="width: 100%; height: 100%; object-fit: cover; display: block;"
                                     fetchpriority="${index < 6 ? 'high' : 'auto'}"
                                     decoding="async"
                                     onerror="this.onerror=null; this.style.display='none';">
                            </div>
                        `;
                    });
                    galleryHtml += '</div>';
                    container.innerHTML = galleryHtml;
                    
                    // Initialize scroll reveal
                    initScrollReveal();
                }
            }
        })();
        
        function openImageModal(index) {
            currentImageIndex = index;
            const modal = document.getElementById('imageModal');
            const modalImage = document.getElementById('modalImage');
            const modalTitle = document.getElementById('modalImageTitle');
            const modalCounter = document.getElementById('modalImageCounter');
            const lightboxInfo = document.querySelector('.lightbox-info');
            
            modalImage.classList.remove('loaded');
            lightboxInfo.classList.remove('visible');
            
            modal.style.display = 'flex';
            setTimeout(() => {
                modal.style.opacity = '1';
            }, 10);
            
            loadImage(index);
            document.addEventListener('keydown', handleKeyboardNavigation);
        }
        
        function loadImage(index) {
            if (index < 0 || index >= galleryImages.length) return;
            
            const image = galleryImages[index];
            const modalImage = document.getElementById('modalImage');
            const modalTitle = document.getElementById('modalImageTitle');
            const modalCounter = document.getElementById('modalImageCounter');
            const lightboxInfo = document.querySelector('.lightbox-info');
            
            modalImage.style.opacity = '0';
            modalImage.style.transform = 'scale(0.9)';
            lightboxInfo.style.opacity = '0';
            
            const img = new Image();
            img.onload = function() {
                modalImage.src = image.url;
                modalImage.alt = image.title;
                modalTitle.textContent = image.title;
                modalCounter.textContent = `${index + 1} / ${galleryImages.length}`;
                
                setTimeout(() => {
                    modalImage.classList.add('loaded');
                    lightboxInfo.classList.add('visible');
                }, 50);
            };
            img.src = image.url;
        }
        
        function navigateImage(direction) {
            const newIndex = currentImageIndex + direction;
            
            if (newIndex < 0) {
                currentImageIndex = galleryImages.length - 1;
            } else if (newIndex >= galleryImages.length) {
                currentImageIndex = 0;
            } else {
                currentImageIndex = newIndex;
            }
            
            loadImage(currentImageIndex);
        }
        
        function closeImageModal() {
            const modal = document.getElementById('imageModal');
            modal.style.opacity = '0';
            setTimeout(() => {
                modal.style.display = 'none';
            }, 300);
            document.removeEventListener('keydown', handleKeyboardNavigation);
        }
        
        function handleKeyboardNavigation(e) {
            if (e.key === 'ArrowLeft') {
                navigateImage(-1);
            } else if (e.key === 'ArrowRight') {
                navigateImage(1);
            } else if (e.key === 'Escape') {
                closeImageModal();
            }
        }
        
        function initScrollReveal() {
            const galleryItems = document.querySelectorAll('.gallery-item.scroll-reveal');
            if (galleryItems.length === 0) return;
            
            const animationQueue = [];
            let isAnimating = false;
            const staggerDelay = 180;
            
            const observerOptions = {
                root: null,
                rootMargin: '200px',
                threshold: 0.05
            };
            
            function processQueue() {
                if (isAnimating || animationQueue.length === 0) return;
                
                isAnimating = true;
                const item = animationQueue.shift();
                item.classList.add('revealed');
                
                setTimeout(() => {
                    isAnimating = false;
                    processQueue();
                }, staggerDelay);
            }
            
            const observer = new IntersectionObserver(function(entries) {
                entries.forEach(entry => {
                    if (entry.isIntersecting && !entry.target.classList.contains('revealed')) {
                        if (!animationQueue.includes(entry.target)) {
                            animationQueue.push(entry.target);
                            processQueue();
                        }
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);
            
            galleryItems.forEach(item => {
                observer.observe(item);
            });
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Close on background click
        document.getElementById('imageModal')?.addEventListener('click', function(e) {
            if (e.target === this || e.target.classList.contains('lightbox-content')) {
                closeImageModal();
            }
        });
        
        document.getElementById('modalImage')?.addEventListener('click', function(e) {
            e.stopPropagation();
        });
    </script>
    <script src="js/main.js?v=20261022b"></script>
    <style>
        .scroll-reveal {
            opacity: 1;
            transform: none;
        }
        .scroll-reveal.revealed {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .gallery-item:hover img {
            transform: scale(1.1);
        }
        .lightbox-close:hover,
        .lightbox-nav:hover {
            background: rgba(255,255,255,0.3) !important;
        }
        .lightbox-image.loaded {
            opacity: 1 !important;
            transform: scale(1) !important;
        }
        .lightbox-info.visible {
            opacity: 1 !important;
        }
    </style>
</body>
</html>
