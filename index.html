<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
    (function(){
      function showUrl(url){
        if(!url)return url;
        var value=String(url).trim();
        if(!value||value.indexOf('data:')===0||/^https?:/i.test(value)||value.charAt(0)==='/')return value;
        return '/'+value.replace(/^\.?\//,'');
      }
      function preload(urls){
        var seen={};
        (urls||[]).forEach(function(url,index){
          var src=showUrl(url);
          if(!src||seen[src]||index>2)return;
          seen[src]=1;
          var link=document.createElement('link');
          link.rel='preload';link.as='image';link.href=src;
          if(index===0)link.setAttribute('fetchpriority','high');
          document.head.appendChild(link);
        });
      }
      try{
        var saved=JSON.parse(localStorage.getItem('sjs_hero_cache')||'null');
        if(saved&&saved.slides)preload(saved.slides);
      }catch(e){}
      window.__heroFast=fetch('/api/public/hero-slides.php',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(data){
        if(data&&data.slides)preload(data.slides);
        return data;
      }).catch(function(){return null;});
      window.__pagePath='homepage-data.php';
      window.__pageData=fetch('/api/public/homepage-data.php',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});
    })();
    </script>
    <title>Excellence Academy - Home</title>
    <link rel="stylesheet" href="css/style.css?v=20261022a">
    <link rel="icon" type="image/x-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
</head>
<body>
    <div id="header-placeholder"></div>
    
    <main>
        <!-- Hero Section -->
        <section class="hero-section" id="home" >
            <div class="hero-content" id="heroSection"  >
                <div class="hero-overlay" >
                    <div class="container" >
                        <h1 class="hero-title" style="color: #ffffff; font-size: 48px; font-weight: 700; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);"></h1>
                        <h2 class="hero-subtitle" style="color: #ffffff; font-size: 24px; font-weight: 400; text-shadow: 1px 1px 2px rgba(0,0,0,0.5);"></h2>
                        <p class="hero-description" style="color: #ffffff; font-size: 18px; margin: 20px 0;"></p>
                        <div class="hero-buttons" >
                            <a href="events.html" class="btn btn-primary">Explore Events</a>
                            <a href="contact.html" class="btn btn-outline-white">Schedule a Visit</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Three Column Sections -->
        <section class="three-column-sections section-padding bg-white" id="home-columns" hidden>
            <div class="container">
                <div class="three-column-grid"></div>
            </div>
        </section>
    </main>
    
    <div id="footer-placeholder"></div>
    
    <script src="js/homepage-loader.js?v=20261022c"></script>
    <script src="js/client-storage.js"></script>
    <script src="js/static-pages.js?v=20261022b"></script>
    <script src="js/main.js?v=20261022b"></script>
    <script src="js/festive-animations.js"></script>
</body>
</html>
