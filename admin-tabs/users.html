<div class="content-card">
    <h2>👥 User Management</h2>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <p style="color: #666;">Manage system users.</p>
        <button class="btn btn-primary" onclick="showAddUserModal()">➕ Add User</button>
    </div>
    
    <div id="usersList">
        <div style="text-align: center; padding: 40px; color: #999;">
            Loading users...
        </div>
    </div>
</div>

<!-- Add User Modal -->
<div id="addUserModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 10000; align-items: center; justify-content: center;">
    <div style="background: white; border-radius: 12px; padding: 30px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
        <h3 style="font-size: 24px; font-weight: bold; margin-bottom: 20px;">➕ Add New User</h3>
        <form id="addUserForm" onsubmit="handleAddUser(event); return false;">
            <div class="form-group">
                <label class="form-label">Username *</label>
                <input type="text" name="username" class="form-input" required>
            </div>
            <div class="form-group">
                <label class="form-label">Email *</label>
                <input type="email" name="email" class="form-input" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password *</label>
                <input type="password" name="password" class="form-input" required minlength="6">
            </div>
            <div class="form-group">
                <label class="form-label">Role</label>
                <select name="role" class="form-input">
                    <option value="user">User</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">💾 Save User</button>
                <button type="button" onclick="closeAddUserModal()" class="btn" style="background: #6b7280; color: white; flex: 1;">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script>
let users = [];

(async function() {
    await loadUsers();
})();

async function loadUsers() {
    try {
        const response = await fetch('api/content/users.php');
        if (response.ok) {
            const data = await response.json();
            if (data.success && data.users) {
                users = data.users;
                displayUsers();
            }
        }
    } catch (error) {
        console.error('Error loading users:', error);
    }
}

function displayUsers() {
    const list = document.getElementById('usersList');
    if (users.length === 0) {
        list.innerHTML = '<div style="text-align: center; padding: 40px; color: #999;">No users found.</div>';
        return;
    }
    
    list.innerHTML = `
        <table class="data-table" style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr style="background: #f9fafb; border-bottom: 2px solid #e5e7eb;">
                    <th style="padding: 12px; text-align: left; font-weight: 600;">ID</th>
                    <th style="padding: 12px; text-align: left; font-weight: 600;">Username</th>
                    <th style="padding: 12px; text-align: left; font-weight: 600;">Email</th>
                    <th style="padding: 12px; text-align: left; font-weight: 600;">Role</th>
                    <th style="padding: 12px; text-align: left; font-weight: 600;">Created</th>
                    <th style="padding: 12px; text-align: left; font-weight: 600;">Actions</th>
                </tr>
            </thead>
            <tbody>
                ${users.map(user => `
                    <tr style="border-bottom: 1px solid #e5e7eb;">
                        <td style="padding: 12px;">${user.id}</td>
                        <td style="padding: 12px;">${user.username || ''}</td>
                        <td style="padding: 12px;">${user.email || ''}</td>
                        <td style="padding: 12px;">
                            <span style="padding: 4px 8px; background: ${user.role === 'admin' ? '#dc3545' : '#28a745'}; color: white; border-radius: 4px; font-size: 11px;">
                                ${(user.role || 'user').toUpperCase()}
                            </span>
                        </td>
                        <td style="padding: 12px;">${user.created_at || ''}</td>
                        <td style="padding: 12px;">
                            <button class="btn" onclick="editUser(${user.id})" style="padding: 5px 10px; font-size: 12px; margin-right: 5px;">Edit</button>
                            <button class="btn btn-danger" onclick="deleteUser(${user.id})" style="padding: 5px 10px; font-size: 12px; background: #ef4444; color: white;">Delete</button>
                        </td>
                    </tr>
                `).join('')}
            </tbody>
        </table>
    `;
}

function showAddUserModal() {
    document.getElementById('addUserModal').style.display = 'flex';
    document.getElementById('addUserForm').reset();
}

function closeAddUserModal() {
    document.getElementById('addUserModal').style.display = 'none';
}

async function handleAddUser(event) {
    event.preventDefault();
    const form = event.target;
    const formData = new FormData(form);
    const data = {};
    formData.forEach((value, key) => {
        data[key] = value;
    });
    
    try {
        const response = await fetch('api/content/users.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await response.json();
        if (result.error) {
            showToast('Error: ' + result.error, 'error');
        } else {
            showToast(result.message || 'User added successfully!', 'success');
            closeAddUserModal();
            await loadUsers();
        }
    } catch (error) {
        console.error('Save error:', error);
        showToast('Save error: ' + error.message, 'error');
    }
}

async function deleteUser(id) {
    if (!confirm('Are you sure you want to delete this user?')) return;
    
    try {
        const response = await fetch('api/content/users.php?id=' + id, {
            method: 'DELETE'
        });
        const result = await response.json();
        if (result.error) {
            showToast('Error: ' + result.error, 'error');
        } else {
            showToast(result.message || 'User deleted successfully!', 'success');
            await loadUsers();
        }
    } catch (error) {
        console.error('Delete error:', error);
        showToast('Delete error: ' + error.message, 'error');
    }
}

function editUser(id) {
    showToast('Edit functionality - use the API to update', 'info');
}

document.getElementById('addUserModal')?.addEventListener('click', function(e) {
    if (e.target === this) closeAddUserModal();
});
</script>
