<div class="content-card">
    <h2>📚 Programs</h2>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <p style="color: #666;">Manage school programs.</p>
        <button class="btn btn-primary" onclick="showAddProgramModal()">➕ Add Program</button>
    </div>
    
    <div id="programsList">
        <div style="text-align: center; padding: 40px; color: #999;">
            Loading programs...
        </div>
    </div>
</div>

<!-- Add Program Modal -->
<div id="addProgramModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 10000; align-items: center; justify-content: center;">
    <div style="background: white; border-radius: 12px; padding: 30px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
        <h3 style="font-size: 24px; font-weight: bold; margin-bottom: 20px;">➕ Add New Program</h3>
        <form id="addProgramForm" onsubmit="handleAddProgram(event); return false;">
            <div class="form-group">
                <label class="form-label">Name *</label>
                <input type="text" name="name" class="form-input" required>
            </div>
            <div class="form-group">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-input" rows="4"></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Duration</label>
                <input type="text" name="duration" class="form-input" placeholder="e.g., 4 years">
            </div>
            <div class="form-group">
                <label class="form-label">Requirements</label>
                <textarea name="requirements" class="form-input" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Image</label>
                <div style="display: flex; align-items: center; gap: 15px;">
                    <div style="flex: 1;">
                        <input type="text" name="image" id="program_image" class="form-input" 
                               placeholder="Select image from media library" readonly>
                    </div>
                    <button type="button" onclick="openMediaLibrary('program_image')" 
                            class="btn btn-primary">🖼️ Select</button>
                </div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">💾 Save Program</button>
                <button type="button" onclick="closeAddProgramModal()" class="btn" style="background: #6b7280; color: white; flex: 1;">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script>
let programs = [];

(async function() {
    await loadPrograms();
})();

async function loadPrograms() {
    try {
        const response = await fetch('api/content/programs.php');
        if (response.ok) {
            const data = await response.json();
            if (data.success && data.programs) {
                programs = data.programs;
                displayPrograms();
            }
        }
    } catch (error) {
        console.error('Error loading programs:', error);
    }
}

function displayPrograms() {
    const list = document.getElementById('programsList');
    if (programs.length === 0) {
        list.innerHTML = `
            <div style="text-align: center; padding: 40px; color: #999;">
                No programs found. Click "Add Program" to create one.
            </div>
        `;
        return;
    }
    
    list.innerHTML = `
        <table class="data-table" style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr style="background: #f9fafb; border-bottom: 2px solid #e5e7eb;">
                    <th style="padding: 12px; text-align: left; font-weight: 600;">Name</th>
                    <th style="padding: 12px; text-align: left; font-weight: 600;">Description</th>
                    <th style="padding: 12px; text-align: left; font-weight: 600;">Duration</th>
                    <th style="padding: 12px; text-align: left; font-weight: 600;">Status</th>
                    <th style="padding: 12px; text-align: left; font-weight: 600;">Actions</th>
                </tr>
            </thead>
            <tbody>
                ${programs.map(program => `
                    <tr style="border-bottom: 1px solid #e5e7eb;">
                        <td style="padding: 12px;">${program.name || ''}</td>
                        <td style="padding: 12px;">${(program.description || '').substring(0, 100)}...</td>
                        <td style="padding: 12px;">${program.duration || ''}</td>
                        <td style="padding: 12px;">
                            <span style="padding: 4px 8px; background: ${program.is_active ? '#28a745' : '#dc3545'}; color: white; border-radius: 4px; font-size: 11px;">
                                ${program.is_active ? 'Active' : 'Inactive'}
                            </span>
                        </td>
                        <td style="padding: 12px;">
                            <button class="btn" onclick="editProgram(${program.id})" style="padding: 5px 10px; font-size: 12px; margin-right: 5px;">Edit</button>
                            <button class="btn btn-danger" onclick="deleteProgram(${program.id})" style="padding: 5px 10px; font-size: 12px; background: #ef4444; color: white;">Delete</button>
                        </td>
                    </tr>
                `).join('')}
            </tbody>
        </table>
    `;
}

function showAddProgramModal() {
    document.getElementById('addProgramModal').style.display = 'flex';
    document.getElementById('addProgramForm').reset();
}

function closeAddProgramModal() {
    document.getElementById('addProgramModal').style.display = 'none';
}

async function handleAddProgram(event) {
    event.preventDefault();
    const form = event.target;
    const formData = new FormData(form);
    const data = {};
    formData.forEach((value, key) => {
        data[key] = value;
    });
    
    try {
        const response = await fetch('api/content/programs.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await response.json();
        if (result.error) {
            showToast('Error: ' + result.error, 'error');
        } else {
            showToast(result.message || 'Program added successfully!', 'success');
            closeAddProgramModal();
            await loadPrograms();
        }
    } catch (error) {
        console.error('Save error:', error);
        showToast('Save error: ' + error.message, 'error');
    }
}

async function deleteProgram(id) {
    if (!confirm('Are you sure you want to delete this program?')) return;
    
    try {
        const response = await fetch('api/content/programs.php?id=' + id, {
            method: 'DELETE'
        });
        const result = await response.json();
        if (result.error) {
            showToast('Error: ' + result.error, 'error');
        } else {
            showToast(result.message || 'Program deleted successfully!', 'success');
            await loadPrograms();
        }
    } catch (error) {
        console.error('Delete error:', error);
        showToast('Delete error: ' + error.message, 'error');
    }
}

function editProgram(id) {
    const program = programs.find(p => p.id == id);
    if (!program) return;
    
    // For now, use prompts - can be enhanced with modal
    const name = prompt('Enter program name:', program.name);
    if (!name) return;
    
    showToast('Edit functionality - use the API to update', 'info');
}

document.getElementById('addProgramModal')?.addEventListener('click', function(e) {
    if (e.target === this) closeAddProgramModal();
});
</script>
