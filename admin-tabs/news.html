<div class="content-card">
    <h2>📰 News</h2>
    <p style="margin-bottom: 30px; color: #666;">Manage news articles and page settings.</p>
    
    <!-- Page Header Image Section -->
    <div style="background: linear-gradient(135deg, #cffafe, #a5f3fc); padding: 25px; border-radius: 12px; border: 2px solid #0891b2; margin-bottom: 30px;">
        <h3 style="font-size: 20px; font-weight: 600; color: #333; margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
            <span>🖼️</span> News Page Header Image
        </h3>
        <form method="POST" action="api/content/news-settings.php" id="newsHeaderForm" onsubmit="return handleAdminFormSubmit(event, this);">
            <div style="display: flex; align-items: start; gap: 15px; margin-bottom: 20px;">
                <div id="newsHeroPreview" style="flex-shrink: 0; width: 160px; height: 96px; background: #f0f0f0; border-radius: 8px; border: 2px dashed #ccc; display: flex; align-items: center; justify-content: center;">
                    <div style="text-align: center;">
                        <span style="font-size: 24px; color: #999;">🖼️</span>
                        <p style="font-size: 11px; color: #999; margin-top: 5px;">No image</p>
                    </div>
                </div>
                <div style="flex: 1;">
                    <input type="text" 
                           name="hero_image" 
                           id="news_hero_image" 
                           class="form-input" 
                           placeholder="Image URL will appear here after selection"
                           readonly
                           onchange="updateNewsHeroPreview(this.value)">
                    <div style="display: flex; gap: 10px; margin-top: 10px;">
                        <button type="button" 
                                onclick="openMediaLibrary('news_hero_image')" 
                                class="btn btn-primary"
                                style="flex: 1; background: linear-gradient(135deg, #0891b2, #0e7490);">
                            🖼️ Select Image from Media Library
                        </button>
                        <button type="button" 
                                onclick="document.getElementById('news_hero_image').value=''; updateNewsHeroPreview('');" 
                                class="btn btn-danger"
                                style="padding: 12px 20px;">
                            Remove Image
                        </button>
                    </div>
                </div>
            </div>
            
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-top: 20px;">
                <div class="form-group">
                    <label class="form-label">Page Title</label>
                    <input type="text" name="title" class="form-input" id="news_page_title" placeholder="News & Updates">
                </div>
                <div class="form-group">
                    <label class="form-label">Page Subtitle</label>
                    <input type="text" name="subtitle" class="form-input" id="news_page_subtitle" placeholder="Stay updated with our latest news">
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary" style="margin-top: 20px; background: linear-gradient(135deg, #0891b2, #0e7490);">
                💾 Save Page Header Settings
            </button>
        </form>
    </div>
    
    <!-- News List -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <p style="color: #666;">Manage news articles.</p>
        <button class="btn btn-primary" onclick="showAddNewsModal()">➕ Add News</button>
    </div>
    
    <div id="newsList">
        <div style="text-align: center; padding: 40px; color: #999;">
            Loading news articles...
        </div>
    </div>
</div>

<!-- Add News Modal -->
<div id="addNewsModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 10000; align-items: center; justify-content: center;">
    <div style="background: white; border-radius: 12px; padding: 30px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
        <h3 style="font-size: 24px; font-weight: bold; margin-bottom: 20px;">➕ Add New News</h3>
        <form id="addNewsForm" onsubmit="handleAddNews(event); return false;">
            <div class="form-group">
                <label class="form-label">Title *</label>
                <input type="text" name="title" class="form-input" required>
            </div>
            <div class="form-group">
                <label class="form-label">Content</label>
                <textarea name="content" class="form-input" rows="6"></textarea>
            </div>
            <div class="form-group">
                <label class="form-label">Excerpt</label>
                <textarea name="excerpt" class="form-input" rows="2" placeholder="Leave empty to auto-generate from content"></textarea>
            </div>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                <div class="form-group">
                    <label class="form-label">Author</label>
                    <input type="text" name="author" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Published Date</label>
                    <input type="datetime-local" name="published_at" class="form-input">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Image</label>
                <div style="display: flex; align-items: center; gap: 15px;">
                    <div style="flex: 1;">
                        <input type="text" name="image" id="news_image" class="form-input" 
                               placeholder="Select image from media library" readonly>
                    </div>
                    <button type="button" onclick="openMediaLibrary('news_image')" 
                            class="btn btn-primary">🖼️ Select</button>
                </div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">💾 Save News</button>
                <button type="button" onclick="closeAddNewsModal()" class="btn" style="background: #6b7280; color: white; flex: 1;">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script>
let newsData = [];
let newsSettings = {};

(async function() {
    await loadNews();
    await loadNewsSettings();
})();

async function loadNews() {
    try {
        const response = await fetch('api/content/news.php');
        if (response.ok) {
            const data = await response.json();
            if (data.success && data.news) {
                newsData = data.news;
                displayNews();
            }
        }
    } catch (error) {
        console.error('Error loading news:', error);
    }
}

async function loadNewsSettings() {
    try {
        const response = await fetch('api/content/news-settings.php');
        if (response.ok) {
            const data = await response.json();
            if (data.success && data.settings) {
                newsSettings = data.settings;
                document.getElementById('news_page_title').value = newsSettings.title || 'News & Updates';
                document.getElementById('news_page_subtitle').value = newsSettings.subtitle || '';
                document.getElementById('news_hero_image').value = newsSettings.hero_image || '';
                updateNewsHeroPreview(newsSettings.hero_image || '');
            }
        }
    } catch (error) {
        console.error('Error loading news settings:', error);
    }
}

function displayNews() {
    const list = document.getElementById('newsList');
    if (newsData.length === 0) {
        list.innerHTML = `
            <div style="text-align: center; padding: 40px; color: #999;">
                No news articles found. Click "Add News" to create one.
            </div>
        `;
        return;
    }
    
    list.innerHTML = `
        <table class="data-table" style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr style="background: #f9fafb; border-bottom: 2px solid #e5e7eb;">
                    <th style="padding: 12px; text-align: left; font-weight: 600;">Image</th>
                    <th style="padding: 12px; text-align: left; font-weight: 600;">Title</th>
                    <th style="padding: 12px; text-align: left; font-weight: 600;">Author</th>
                    <th style="padding: 12px; text-align: left; font-weight: 600;">Published</th>
                    <th style="padding: 12px; text-align: left; font-weight: 600;">Actions</th>
                </tr>
            </thead>
            <tbody>
                ${newsData.map(item => `
                    <tr style="border-bottom: 1px solid #e5e7eb;">
                        <td style="padding: 12px;">
                            ${item.image ? `
                                <img src="${item.image}" alt="${item.title || ''}" style="width: 60px; height: 60px; object-fit: cover; border-radius: 8px;" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                <div style="display: none; width: 60px; height: 60px; background: #e0e0e0; border-radius: 8px; align-items: center; justify-content: center; color: #999; font-size: 24px;">📰</div>
                            ` : `
                                <div style="width: 60px; height: 60px; background: #e0e0e0; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #999; font-size: 24px;">📰</div>
                            `}
                        </td>
                        <td style="padding: 12px;">${item.title || ''}</td>
                        <td style="padding: 12px;">${item.author || ''}</td>
                        <td style="padding: 12px;">${item.published_at || item.created_at || ''}</td>
                        <td style="padding: 12px;">
                            <button class="btn" onclick="editNews(${item.id})" style="padding: 5px 10px; font-size: 12px; margin-right: 5px;">Edit</button>
                            <button class="btn btn-danger" onclick="deleteNews(${item.id})" style="padding: 5px 10px; font-size: 12px; background: #ef4444; color: white;">Delete</button>
                        </td>
                    </tr>
                `).join('')}
            </tbody>
        </table>
    `;
}

function updateNewsHeroPreview(url) {
    const preview = document.getElementById('newsHeroPreview');
    if (url && url.trim()) {
        preview.innerHTML = `<img src="${url}" alt="Page header preview" style="width: 160px; height: 96px; object-fit: cover; border-radius: 8px; border: 2px solid #0891b2; box-shadow: 0 4px 6px rgba(0,0,0,0.1);" onerror="this.onerror=null; this.parentElement.innerHTML='<div style=\\'text-align: center;\\'><span style=\\'font-size: 24px; color: #999;\\'>🖼️</span><p style=\\'font-size: 11px; color: #999; margin-top: 5px;\\'>No image</p></div>'"><p style="text-align: center; font-size: 11px; color: #666; margin-top: 5px;">Preview</p>`;
    } else {
        preview.innerHTML = '<div style="text-align: center;"><span style="font-size: 24px; color: #999;">🖼️</span><p style="font-size: 11px; color: #999; margin-top: 5px;">No image</p></div>';
    }
}

function showAddNewsModal() {
    document.getElementById('addNewsModal').style.display = 'flex';
    document.getElementById('addNewsForm').reset();
}

function closeAddNewsModal() {
    document.getElementById('addNewsModal').style.display = 'none';
}

async function handleAddNews(event) {
    event.preventDefault();
    const form = event.target;
    const formData = new FormData(form);
    const data = {};
    formData.forEach((value, key) => {
        if (value) data[key] = value;
    });
    
    try {
        const response = await fetch('api/content/news.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await response.json();
        if (result.error) {
            showToast('Error: ' + result.error, 'error');
        } else {
            showToast(result.message || 'News added successfully!', 'success');
            closeAddNewsModal();
            await loadNews();
        }
    } catch (error) {
        console.error('Save error:', error);
        showToast('Save error: ' + error.message, 'error');
    }
}

async function deleteNews(id) {
    if (!confirm('Are you sure you want to delete this news article?')) return;
    
    try {
        const response = await fetch('api/content/news.php?id=' + id, {
            method: 'DELETE'
        });
        const result = await response.json();
        if (result.error) {
            showToast('Error: ' + result.error, 'error');
        } else {
            showToast(result.message || 'News deleted successfully!', 'success');
            await loadNews();
        }
    } catch (error) {
        console.error('Delete error:', error);
        showToast('Delete error: ' + error.message, 'error');
    }
}

function editNews(id) {
    const news = newsData.find(n => n.id == id);
    if (!news) return;
    showToast('Edit functionality - use the API to update', 'info');
}

document.getElementById('addNewsModal')?.addEventListener('click', function(e) {
    if (e.target === this) closeAddNewsModal();
});
</script>
