<div class="content-card">
    <h2>🔗 Social Media</h2>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <p style="color: #666;">Manage social media links.</p>
        <button class="btn btn-primary" onclick="showAddSocialMediaModal()">➕ Add Social Media</button>
    </div>
    
    <div id="socialMediaList">
        <div style="text-align: center; padding: 40px; color: #999;">
            Loading social media links...
        </div>
    </div>
</div>

<!-- Add Social Media Modal -->
<div id="addSocialMediaModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 10000; align-items: center; justify-content: center;">
    <div style="background: white; border-radius: 12px; padding: 30px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.3);">
        <h3 style="font-size: 24px; font-weight: bold; margin-bottom: 20px;">➕ Add New Social Media</h3>
        <form id="addSocialMediaForm" onsubmit="handleAddSocialMedia(event); return false;">
            <div class="form-group">
                <label class="form-label">Platform *</label>
                <input type="text" name="platform" class="form-input" required placeholder="e.g., Facebook, Twitter, Instagram">
            </div>
            <div class="form-group">
                <label class="form-label">URL *</label>
                <input type="url" name="url" class="form-input" required placeholder="https://...">
            </div>
            <div class="form-group">
                <label class="form-label">Icon</label>
                <input type="text" name="icon" class="form-input" placeholder="e.g., 📘, 🐦, 📷">
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">💾 Save Social Media</button>
                <button type="button" onclick="closeAddSocialMediaModal()" class="btn" style="background: #6b7280; color: white; flex: 1;">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script>
let socialMedia = [];

(async function() {
    await loadSocialMedia();
})();

async function loadSocialMedia() {
    try {
        const response = await fetch('api/content/social-media.php');
        if (response.ok) {
            const data = await response.json();
            if (data.success && data.socialMedia) {
                socialMedia = data.socialMedia;
                displaySocialMedia();
            }
        }
    } catch (error) {
        console.error('Error loading social media:', error);
    }
}

function displaySocialMedia() {
    const list = document.getElementById('socialMediaList');
    if (socialMedia.length === 0) {
        list.innerHTML = `
            <div style="text-align: center; padding: 40px; color: #999;">
                No social media links found. Click "Add Social Media" to create one.
            </div>
        `;
        return;
    }
    
    list.innerHTML = `
        <table class="data-table" style="width: 100%; border-collapse: collapse;">
            <thead>
                <tr style="background: #f9fafb; border-bottom: 2px solid #e5e7eb;">
                    <th style="padding: 12px; text-align: left; font-weight: 600;">Platform</th>
                    <th style="padding: 12px; text-align: left; font-weight: 600;">URL</th>
                    <th style="padding: 12px; text-align: left; font-weight: 600;">Icon</th>
                    <th style="padding: 12px; text-align: left; font-weight: 600;">Status</th>
                    <th style="padding: 12px; text-align: left; font-weight: 600;">Actions</th>
                </tr>
            </thead>
            <tbody>
                ${socialMedia.map(social => `
                    <tr style="border-bottom: 1px solid #e5e7eb;">
                        <td style="padding: 12px;">${social.platform || ''}</td>
                        <td style="padding: 12px;">
                            <a href="${social.url || '#'}" target="_blank" style="color: #3b82f6;">${social.url || ''}</a>
                        </td>
                        <td style="padding: 12px;">${social.icon || ''}</td>
                        <td style="padding: 12px;">
                            <span style="padding: 4px 8px; background: ${social.is_active ? '#28a745' : '#dc3545'}; color: white; border-radius: 4px; font-size: 11px;">
                                ${social.is_active ? 'Active' : 'Inactive'}
                            </span>
                        </td>
                        <td style="padding: 12px;">
                            <button class="btn" onclick="editSocialMedia(${social.id})" style="padding: 5px 10px; font-size: 12px; margin-right: 5px;">Edit</button>
                            <button class="btn btn-danger" onclick="deleteSocialMedia(${social.id})" style="padding: 5px 10px; font-size: 12px; background: #ef4444; color: white;">Delete</button>
                        </td>
                    </tr>
                `).join('')}
            </tbody>
        </table>
    `;
}

function showAddSocialMediaModal() {
    document.getElementById('addSocialMediaModal').style.display = 'flex';
    document.getElementById('addSocialMediaForm').reset();
}

function closeAddSocialMediaModal() {
    document.getElementById('addSocialMediaModal').style.display = 'none';
}

async function handleAddSocialMedia(event) {
    event.preventDefault();
    const form = event.target;
    const formData = new FormData(form);
    const data = {};
    formData.forEach((value, key) => {
        data[key] = value;
    });
    
    try {
        const response = await fetch('api/content/social-media.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const result = await response.json();
        if (result.error) {
            showToast('Error: ' + result.error, 'error');
        } else {
            showToast(result.message || 'Social media added successfully!', 'success');
            closeAddSocialMediaModal();
            await loadSocialMedia();
        }
    } catch (error) {
        console.error('Error:', error);
        showToast('Failed to add social media. Please try again.', 'error');
    }
}

async function deleteSocialMedia(id) {
    if (!confirm('Are you sure you want to delete this social media link?')) return;
    
    try {
        const response = await fetch('api/content/social-media.php?id=' + id, {
            method: 'DELETE'
        });
        const result = await response.json();
        if (result.error) {
            showToast('Error: ' + result.error, 'error');
        } else {
            showToast(result.message || 'Social media deleted successfully!', 'success');
            await loadSocialMedia();
        }
    } catch (error) {
        console.error('Error:', error);
        showToast('Failed to delete social media. Please try again.', 'error');
    }
}

function editSocialMedia(id) {
    const social = socialMedia.find(s => s.id == id);
    if (!social) return;
    
    showToast('Edit functionality - use the API to update', 'info');
}

document.getElementById('addSocialMediaModal')?.addEventListener('click', function(e) {
    if (e.target === this) closeAddSocialMediaModal();
});
</script>
